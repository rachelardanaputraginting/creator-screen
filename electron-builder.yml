# Packaging config for the desktop app (Windows installer + Linux AppImage).
#
# The renderer is a static export (`out/`) served through the privileged `app://`
# scheme, so `out/**` has to ship inside the asar. The main process only requires
# Node builtins, `electron`, and its own local files - no runtime dependency -
# so `node_modules` is excluded outright; without that exclusion the installer
# balloons by hundreds of megabytes.

appId: com.chelution.creatorscreen
productName: Creator Screen
compression: maximum
afterPack: scripts/afterpack-strip.cjs

directories:
  output: dist

files:
  - electron/**/*
  - out/**/*
  - package.json
  - "!**/*.test.js"
  - "!node_modules/**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Creator Screen
  artifactName: CreatorScreen-Setup-${version}.${ext}

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: assets/icon.png
  category: Video
  synopsis: Screen recorder and stream overlay
  description: >-
    Creator Screen captures your screen and camera, mixes them into one
    composition and records the result in HD.
  artifactName: CreatorScreen-${version}.${ext}
